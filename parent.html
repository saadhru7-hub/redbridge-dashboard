<style>
  :root{
    --blue:#7367F0; --blue-light:#EDECFD; --blue-deep:#5B4FD9;
    --green:#28C76F; --green-light:#E9F9EF;
    --amber:#FF9F43; --amber-light:#FFF3E8;
    --red:#EA5455; --red-light:#FDEAEA;
    --ink:#3D3B54; --text-2:#5D596C; --text-3:#8A8697; --text-4:#B4B0BF;
    --bg:#F8F7FA; --surface:#FFFFFF; --border:#E7E7E9; --rule-light:#F1F0F4;
    --shadow-1: 0 2px 10px rgba(76,72,110,0.06);
    --shadow-2: 0 8px 30px rgba(76,72,110,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
  h1,h2,h3{font-family:'Outfit',sans-serif;}
  button{font-family:inherit;}
  input{font-family:inherit;}

  /* ── LOGIN ── */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(135deg,#7367F0 0%,#5B4FD9 100%);}
  .login-card{background:var(--surface);border-radius:22px;padding:36px 30px;max-width:380px;width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);text-align:center;}
  .login-crest{width:64px;height:64px;border-radius:16px;background:var(--blue-light);margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;font-size:30px;}
  .login-card h1{font-size:20px;font-weight:800;margin:0 0 4px;color:var(--ink);}
  .login-card .sub{font-size:13px;color:var(--text-3);margin-bottom:26px;}
  #code-input{width:100%;padding:16px;border-radius:12px;border:2px solid var(--border);
    font-size:22px;font-weight:800;text-align:center;letter-spacing:4px;text-transform:uppercase;
    outline:none;margin-bottom:14px;color:var(--ink);}
  #code-input:focus{border-color:var(--blue);}
  #login-btn{width:100%;padding:15px;border-radius:12px;border:none;background:var(--blue);
    color:white;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s;}
  #login-btn:hover{background:var(--blue-deep);}
  #login-error{color:var(--red);font-size:12.5px;font-weight:600;margin-top:12px;min-height:16px;}
  .login-footer{font-size:11px;color:var(--text-4);margin-top:22px;}

  .lang-switcher{display:flex;gap:4px;}
  .lang-btn{padding:6px 11px;border-radius:7px;border:1.5px solid var(--border);background:var(--surface);
    color:var(--text-2);font-size:11.5px;font-weight:700;cursor:pointer;}
  .lang-btn.active{background:var(--blue);color:white;border-color:var(--blue);}

  /* ── APP SHELL ── */
  #app{display:none;min-height:100vh;}
  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 20px;
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  .topbar-student{display:flex;align-items:center;gap:12px;}
  .avatar-circle{width:44px;height:44px;border-radius:12px;background:var(--blue);color:white;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;}
  .topbar-student .name{font-size:15px;font-weight:800;color:var(--ink);}
  .topbar-student .class{font-size:12px;color:var(--text-3);}
  #logout-btn{background:none;border:1.5px solid var(--border);border-radius:9px;padding:8px 14px;
    font-size:12.5px;font-weight:600;color:var(--text-2);cursor:pointer;}

  .tabs{display:flex;gap:6px;padding:12px 16px;overflow-x:auto;background:var(--surface);
    border-bottom:1px solid var(--border);position:sticky;top:77px;z-index:9;}
  .tab-btn{flex-shrink:0;padding:9px 16px;border-radius:20px;border:none;background:var(--bg);
    color:var(--text-2);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s;position:relative;}
  .tab-btn.active{background:var(--blue);color:white;}
  .tab-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#EF4444;
    margin-left:5px;vertical-align:2px;}

  .content{padding:18px 16px 40px;max-width:640px;margin:0 auto;}
  .card{background:var(--surface);border-radius:16px;box-shadow:var(--shadow-1);margin-bottom:14px;overflow:hidden;}
  .card-body{padding:16px 18px;}
  .empty-state{text-align:center;padding:50px 20px;color:var(--text-3);}
  .empty-state .icon{font-size:38px;margin-bottom:10px;}
  .empty-state .msg{font-size:13.5px;font-weight:600;color:var(--text-2);}

  .item-row{padding:14px 18px;border-bottom:1px solid var(--rule-light);}
  .item-row:last-child{border-bottom:none;}
  .item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .item-title{font-size:13.5px;font-weight:700;color:var(--ink);}
  .item-date{font-size:11px;color:var(--text-4);}
  .item-detail{font-size:12.5px;color:var(--text-2);line-height:1.5;}
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}

  .score-pill{display:inline-flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:10px;min-width:50px;}
  .score-pill .lbl{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.75;}
  .score-pill .val{font-size:16px;font-weight:800;}

  #messages-list{padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-height:50vh;overflow-y:auto;}
  .msg-bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.4;}
  .msg-parent{align-self:flex-end;background:var(--blue);color:white;border-bottom-right-radius:4px;}
  .msg-teacher{align-self:flex-start;background:var(--bg);color:var(--ink);border-bottom-left-radius:4px;}
  .msg-input-row{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--rule-light);}
  #msg-input{flex:1;padding:11px 14px;border-radius:20px;border:1.5px solid var(--border);outline:none;font-size:13px;}
  #msg-send{background:var(--blue);color:white;border:none;border-radius:20px;padding:0 20px;font-weight:700;font-size:13px;cursor:pointer;}

  .teacher-picker{display:flex;flex-direction:column;gap:8px;padding:14px 16px;}
  .teacher-option{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
    border-radius:12px;border:1.5px solid var(--border);cursor:pointer;transition:all .15s;}
  .teacher-option:hover{border-color:var(--blue);background:var(--blue-light);}
  .teacher-option .subj{font-size:11px;color:var(--text-3);}

  .loading{text-align:center;padding:40px;color:var(--text-3);font-size:13px;}
</style>
</head>
<body>

<!-- ══════════ LOGIN SCREEN ══════════ -->
<div id="login-screen">

    <button class="tab-btn" data-tab="marks" onclick="switchTab('marks')">📊 <span data-i18n="tab_marks">Marks</span></button>
    <button class="tab-btn" data-tab="attendance" onclick="switchTab('attendance')">📅 <span data-i18n="tab_attendance">Attendance</span></button>
    <button class="tab-btn" data-tab="discipline" onclick="switchTab('discipline')">🛡 <span data-i18n="tab_discipline">Discipline</span></button>
    <button class="tab-btn" data-tab="progress" onclick="switchTab('progress')">📈 <span data-i18n="tab_progress">Progress</span></button>
    <button class="tab-btn" data-tab="calendar" onclick="switchTab('calendar')">📅 <span data-i18n="tab_calendar">Calendar</span></button>
  </div>

  <div class="content">
    <div id="tab-homework"></div>
    <div id="tab-timetable" style="display:none;"></div>
    <div id="tab-scores" style="display:none;"></div>
    <div id="tab-marks" style="display:none;"></div>
    <div id="tab-attendance" style="display:none;"></div>
    <div id="tab-discipline" style="display:none;"></div>
    <div id="tab-progress" style="display:none;"></div>
    <div id="tab-calendar" style="display:none;"></div>
  </div>
</div>

<script>
  // ══ LANGUAGE SYSTEM ═══════════════════════════════════════════════════
  var _lang = 'en';
  var TRANSLATIONS = {

      tab_discipline: 'Дисциплина', tab_progress: 'Динамика', tab_calendar: 'Календарь',
      tab_timetable: 'Расписание', no_timetable: 'Расписание пока недоступно',
      code_not_found: 'Код не распознан. Проверьте и попробуйте снова.',
      code_empty: 'Пожалуйста, введите код доступа.',
      conn_error: 'Ошибка соединения. Попробуйте снова.',
      checking: 'Проверка…',
      no_homework: 'Домашние задания пока не записаны',

      lesson_cancelled: 'Урок отменён',
      cw_label: 'Классная работа', hw_label: 'Домашняя работа', disc_label: 'Дисциплина', comment_label: 'Комментарий',
      subject_label: 'Предмет', cw_abbr: 'КР', hw_abbr: 'ДЗ', disc_abbr: 'Д',
      no_marks: 'Оценок пока нет', absent: 'Отсутствовал', present: 'Присутствовал',
      no_attendance: 'Записей о посещаемости пока нет', absences_of: 'пропусков из', lessons_recorded: 'записанных уроков',
      no_discipline: 'Нет замечаний по дисциплине — всё в порядке!',
      marks_trend: 'Оценки по времени', attendance_trend: 'Посещаемость по времени',
      no_events: 'Пока нет предстоящих событий',
      could_not_load: 'Не удалось загрузить. Попробуйте снова.',
    },
    uz: {
      login_title: 'Redbridge ota-onalar portali', login_sub: 'Maktab tomonidan berilgan kirish kodini kiriting',
      login_btn: "Farzandim haqida maʼlumot koʻrish", logout: 'Chiqish',
      tab_homework: 'Uy vazifasi', tab_scores: 'Kunlik baholar', tab_marks: 'Baholar', tab_attendance: 'Davomat',
      tab_discipline: 'Intizom', tab_progress: 'Dinamika', tab_calendar: 'Kalendar',
      tab_timetable: 'Dars jadvali', no_timetable: 'Dars jadvali hali mavjud emas',
      code_not_found: 'Kod topilmadi. Tekshirib, qayta urinib koʻring.',
      code_empty: 'Iltimos, kirish kodini kiriting.',
      conn_error: 'Ulanish xatosi. Qayta urinib koʻring.',
      checking: 'Tekshirilmoqda…',
      no_homework: 'Hozircha uy vazifalari yozilmagan',
      classwork: 'Sinf ishi', homework: 'Uy vazifasi',
      no_scores: 'Hozircha kunlik baholar yoʻq',
      lesson_cancelled: 'Dars bekor qilindi',
      cw_label: 'Sinf ishi', hw_label: 'Uy vazifasi', disc_label: 'Intizom', comment_label: 'Izoh',
      subject_label: 'Fan', cw_abbr: 'SI', hw_abbr: 'UV', disc_abbr: 'I',
      no_marks: 'Hozircha baholar yoʻq', absent: 'Kelmagan', present: 'Kelgan',
      no_attendance: 'Hozircha davomat yozuvlari yoʻq', absences_of: 'ta yoʻqlik, jami', lessons_recorded: 'ta darsdan',
      no_discipline: 'Intizom holatlari yoʻq — hammasi joyida!',
      marks_trend: 'Vaqt boʻyicha baholar', attendance_trend: 'Vaqt boʻyicha davomat',
      no_events: 'Hozircha rejalashtirilgan tadbirlar yoʻq',
      could_not_load: 'Yuklab boʻlmadi. Qayta urinib koʻring.',
    }
  };

  function t(key) {
    var lang = TRANSLATIONS[_lang] || TRANSLATIONS.en;
    return lang[key] || TRANSLATIONS.en[key] || key;
  }

  function setLang(lang) {
    _lang = lang;
    localStorage.setItem('parent_lang', lang);
    document.querySelectorAll('.lang-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    var activeTab = document.querySelector('.tab-btn.active');
    if (activeTab && _student) switchTab(activeTab.dataset.tab);
  }

  var _SB_URL = 'https://rqbdfwdegblwzbdqjsdo.supabase.co';
  var _SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxYmRmd2RlZ2Jsd3piZHFqc2RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQyMjEzMzgsImV4cCI6MjA4OTc5NzMzOH0.GdfidDRBpdD1tZEam7_gjWaj5basR60FOjUOxvL6V2k';

  var _student = null;

  function sbHeaders(extra) {
    var h = { 'apikey': _SB_KEY, 'Authorization': 'Bearer ' + _SB_KEY, 'Accept': 'application/json' };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }

  // Returns a URL that opens a file for VIEWING rather than downloading it.
  // Images and PDFs render inline in the browser natively. Word/Excel/
  // PowerPoint files can never be displayed inline by any browser, no
  // matter what — those are routed through Google's document viewer,
  // which renders them in-page without ever triggering a download.
  function fileViewUrl(url, fileName) {
    if (!url) return url;
    var ext = (fileName || url).split('.').pop().toLowerCase().split('?')[0];
    var officeFormats = ['doc','docx','ppt','pptx','xls','xlsx'];
    if (officeFormats.indexOf(ext) !== -1) {
      return 'https://docs.google.com/viewer?url=' + encodeURIComponent(url) + '&embedded=true';
    }
    return url;
  }

  // ── LOGIN ──
  function doLogin() {
    var code = document.getElementById('code-input').value.trim().toUpperCase();
    var errEl = document.getElementById('login-error');
    errEl.textContent = '';
    if (!code) { errEl.textContent = t('code_empty'); return; }

    document.getElementById('login-btn').textContent = t('checking');

    fetch(_SB_URL + '/rest/v1/students?access_code=eq.' + encodeURIComponent(code) + '&select=*', {
      headers: sbHeaders()
    })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows) {
      document.getElementById('login-btn').textContent = t('login_btn');
      if (!rows || !rows.length) {
        errEl.textContent = t('code_not_found');
        return;
      }
      _student = rows[0];
      localStorage.setItem('parent_code', code);
      showApp();
    })
    .catch(function() {
      document.getElementById('login-btn').textContent = t('login_btn');
      errEl.textContent = t('conn_error');
    });
  }

  function doLogout() {
    localStorage.removeItem('parent_code');
    _student = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('code-input').value = '';
  }

  function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';

    var initials = (_student.full_name_en || '').split(' ').map(function(w){return w[0];}).slice(0,2).join('').toUpperCase();
    document.getElementById('student-avatar').textContent = initials || '--';
    document.getElementById('student-name').textContent = _student.full_name_en || _student.full_name_ru;
    document.getElementById('student-class').textContent = 'Class ' + _student.class;

    loadHomework();
  }

  // (Notification/badge system removed along with the Message Teacher tab)

  // ── TABS ──
  function switchTab(tab) {
    ['homework','timetable','scores','marks','attendance','discipline','progress','calendar'].forEach(function(t) {
      document.getElementById('tab-' + t).style.display = (t === tab) ? 'block' : 'none';
    });
    document.querySelectorAll('.tab-btn').forEach(function(b) {
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    if (tab === 'homework') loadHomework();
    if (tab === 'timetable') loadTimetable();
    if (tab === 'scores') loadDailyScores();
    if (tab === 'marks') loadMarks();
    if (tab === 'attendance') loadAttendance();
    if (tab === 'discipline') loadDiscipline();
    if (tab === 'progress') loadProgress();
    if (tab === 'calendar') loadCalendar();
  }

  function studentFullNames() {
    return [_student.full_name_en, _student.full_name_ru].filter(Boolean);
  }

  // Exact string equality (names.indexOf(s.name)) was used everywhere a
  // student's saved records get matched against their own name. That's
  // fragile: a trailing space, different capitalization, or extra internal
  // whitespace between the two data-entry points (setting up the roster vs.
  // whatever a teacher's device saved into a report) makes the match fail
  // silently — no error, the tab just shows "no data yet" even though the
  // record genuinely exists. This normalizes both sides before comparing.
  function normName(s) {
    return (s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  }
  function isMyName(candidate) {
    var norm = normName(candidate);
    if (!norm) return false;
    return studentFullNames().some(function(n) { return normName(n) === norm; });
  }

  // ── HOMEWORK / CLASSWORK (text) ──
  function loadHomework() {
    var el = document.getElementById('tab-homework');
    el.innerHTML = '<div class="loading">Loading…</div>';

    fetch(_SB_URL + '/rest/v1/daily_reports?class=eq.' + encodeURIComponent(_student.class) + '&order=date.desc&limit=30&select=*', {
      headers: sbHeaders()
    })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows) {
      rows = (rows || []).filter(function(r) { return r.topic || r.homework; });
      if (!rows.length) {
        el.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">📝</div><div class="msg">' + t('no_homework') + '</div></div></div>';
        return;
      }

      // Group entries by date so a parent sees everything from one day
      // together under a single clear header, instead of a flat list
      // repeating the date on every single row.
      var byDate = {};
      var dateOrder = [];
      rows.forEach(function(r) {
        if (!byDate[r.date]) { byDate[r.date] = []; dateOrder.push(r.date); }
        byDate[r.date].push(r);
      });

      function formatDateHeader(dateStr) {
        var d = new Date(dateStr + 'T00:00:00');
        if (isNaN(d)) return dateStr;
        var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
      }

      var html = '';
      dateOrder.forEach(function(dateStr) {
        html += '<div class="card" style="margin-bottom:12px;">' +
          '<div style="padding:10px 16px;background:var(--blue,#3b82f6);color:white;font-weight:700;font-size:13px;border-radius:10px 10px 0 0;">' +
            formatDateHeader(dateStr) +
          '</div>';
        byDate[dateStr].forEach(function(r, idx) {
          html += '<div class="item-row"' + (idx > 0 ? ' style="border-top:1px solid var(--border,#e5e7eb);"' : '') + '>' +
            '<div class="item-top"><div class="item-title">' + (r.subject||'') + '</div></div>';
          if (r.topic) html += '<div class="item-detail"><b>' + t('classwork') + ':</b> ' + r.topic + '</div>';
          if (r.topic_file_url) html += '<div class="item-detail"><a href="' + fileViewUrl(r.topic_file_url, r.topic_file_name) + '" target="_blank" style="color:var(--blue);">📎 ' + (r.topic_file_name||'File') + '</a></div>';
          if (r.homework) html += '<div class="item-detail" style="margin-top:4px;"><b>' + t('homework') + ':</b> ' + r.homework + '</div>';
          if (r.homework_file_url) html += '<div class="item-detail"><a href="' + fileViewUrl(r.homework_file_url, r.homework_file_name) + '" target="_blank" style="color:var(--blue);">📎 ' + (r.homework_file_name||'File') + '</a></div>';
          html += '</div>';
        });
        html += '</div>';
      });
      el.innerHTML = html;
    })
    .catch(function() { el.innerHTML = '<div class="card"><div class="empty-state"><div class="msg">' + t('could_not_load') + '</div></div></div>'; });
  }

  // ── TIMETABLE (this child's class only — filtered server-side, never
  // the whole school's schedule) — landscape weekly grid, one page,
  // matching the reference layout: days across the top, periods down
  // the side, one cell per lesson.
  function loadTimetable() {
    var el = document.getElementById('tab-timetable');
    el.innerHTML = '<div class="loading">Loading…</div>';

    fetch(_SB_URL + '/rest/v1/timetable?class=eq.' + encodeURIComponent(_student.class) + '&select=day,period,subject,teacher_name', {
      headers: sbHeaders()
    })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows) {
      if (!rows || !rows.length) {
        el.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">🗓</div><div class="msg">' + t('no_timetable') + '</div></div></div>';
        return;
      }

      // Same period times as the staff dashboard — kept in sync there
      // (period 6 is 14:40–15:30, not 14:35–15:25 — that was a real data
      // error fixed directly in Supabase).
      var TIMES = {1:'08:10–09:00',2:'09:45–10:35',3:'10:40–11:30',4:'11:35–12:25',5:'13:45–14:35',6:'14:40–15:30',7:'15:35–16:25'};
      var DAY_ORDER = ['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY'];
      var DAY_LABEL = {MONDAY:'Mon',TUESDAY:'Tue',WEDNESDAY:'Wed',THURSDAY:'Thu',FRIDAY:'Fri'};
      var SUBJ_COLORS = ['#3b82f6','#8b5cf6','#f59e0b','#10b981','#ef4444','#06b6d4','#ec4899','#84cc16'];
      var colorOf = {}; var nextColor = 0;
      function colorFor(subj) {
        if (!colorOf[subj]) { colorOf[subj] = SUBJ_COLORS[nextColor % SUBJ_COLORS.length]; nextColor++; }
        return colorOf[subj];
      }

      // grid[period][day] = {subject, teacher}
      var grid = {};
      var maxPeriod = 1;
      rows.forEach(function(r) {
        var day = (r.day || '').toUpperCase();
        if (DAY_ORDER.indexOf(day) === -1) return; // skip weekend/unknown rows, if any
        var periodNum = parseInt(String(r.period).replace(/[^0-9]/g, ''), 10);
        if (isNaN(periodNum)) return;
        maxPeriod = Math.max(maxPeriod, periodNum);
        grid[periodNum] = grid[periodNum] || {};
        grid[periodNum][day] = { subject: r.subject, teacher: r.teacher_name };
      });

      var html = '<div class="card" style="overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px;">' +
        '<table style="border-collapse:collapse;width:100%;min-width:560px;font-size:11px;">' +
        '<thead><tr>' +
          '<th style="width:56px;padding:6px 4px;text-align:center;color:var(--muted,#64748b);font-size:10px;"></th>';
      DAY_ORDER.forEach(function(day) {
        html += '<th style="padding:6px 4px;text-align:center;background:var(--blue,#3b82f6);color:white;font-weight:700;font-size:11.5px;border-radius:6px 6px 0 0;">' + DAY_LABEL[day] + '</th>';
      });
      html += '</tr></thead><tbody>';

      for (var p = 1; p <= maxPeriod; p++) {
        html += '<tr>' +
          '<td style="padding:4px;text-align:center;vertical-align:top;border-right:1px solid var(--border,#e5e7eb);">' +
            '<div style="font-weight:700;font-size:11px;">' + p + '</div>' +
            '<div style="font-size:8.5px;color:var(--muted,#64748b);white-space:nowrap;">' + (TIMES[p]||'') + '</div>' +
          '</td>';
        DAY_ORDER.forEach(function(day) {
          var cell = (grid[p]||{})[day];
          if (cell) {
            var c = colorFor(cell.subject);
            html += '<td style="padding:3px;vertical-align:top;">' +
              '<div style="background:' + c + '18;border-left:2.5px solid ' + c + ';border-radius:5px;padding:4px 5px;min-height:34px;">' +
                '<div style="font-weight:700;font-size:10.5px;color:' + c + ';line-height:1.2;">' + (cell.subject||'') + '</div>' +
                (cell.teacher ? '<div style="font-size:8.5px;color:var(--muted,#64748b);line-height:1.2;">' + cell.teacher + '</div>' : '') +
              '</div>' +
            '</td>';
          } else {
            html += '<td style="padding:3px;"></td>';
          }
        });
        html += '</tr>';
      }
      html += '</tbody></table></div>';
      el.innerHTML = html;
    })
    .catch(function() { el.innerHTML = '<div class="card"><div class="empty-state"><div class="msg">' + t('could_not_load') + '</div></div></div>'; });
  }


  function loadDailyScores() {
    var el = document.getElementById('tab-scores');
    el.innerHTML = '<div class="loading">Loading…</div>';
    var names = studentFullNames();

    fetch(_SB_URL + '/rest/v1/daily_reports?class=eq.' + encodeURIComponent(_student.class) + '&order=date.asc&limit=60&select=*', {
      headers: sbHeaders()
    })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows) {
      var records = [];
      (rows||[]).forEach(function(r) {
        if (r.cancelled) {
          records.push({ date:r.date, subject:r.subject, cancelled:true, cancel_reason:r.cancel_reason });
          return;
        }
        (r.students||[]).forEach(function(s) {
          if (!isMyName(s.name)) return;
          if (s.absent) { records.push({ date:r.date, subject:r.subject, absent:true }); return; }
          if (s.cw === undefined && s.hw === undefined && s.disc === undefined && !s.comment) return;
          records.push({ date:r.date, subject:r.subject, cw:s.cw, hw:s.hw, disc:s.disc, comment:s.comment, absent:false });
        });
      });
      if (!records.length) {
        el.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">📋</div><div class="msg">' + t('no_scores') + '</div></div></div>';
        return;
      }

      // Grid: one row per subject, one column-group (CW/HW/D) per date —
      // the same structure as the teacher-facing marking grid in the
      // dashboard, just for this one student. Scrolls left-to-right if
      // there are more dates than fit, same as the Attendance register.
      var dateSet = {}, subjectSet = {};
      var grid = {}; // grid[subject][date] = record
      records.forEach(function(r) {
        dateSet[r.date] = true;
        subjectSet[r.subject] = true;
        grid[r.subject] = grid[r.subject] || {};
        grid[r.subject][r.date] = r;
      });
      var dates = Object.keys(dateSet).sort();
      var subjects = Object.keys(subjectSet).sort();

      function shortDate(dateStr) {
        var d = new Date(dateStr + 'T00:00:00');
        if (isNaN(d)) return dateStr;
        var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        return d.getDate() + ' ' + months[d.getMonth()];
      }
      function pillColor(v) {
        if (!v) return { bg:'#f1f5f9', fg:'#94a3b8' };
        return v >= 4 ? { bg:'var(--green-light)', fg:'var(--green)' } : v === 3 ? { bg:'var(--amber-light)', fg:'var(--amber)' } : { bg:'var(--red-light)', fg:'var(--red)' };
      }

      var html = '<div class="card"><div style="overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px;">' +
        '<table style="border-collapse:collapse;font-size:11px;">' +
        '<thead><tr>' +
          '<th rowspan="2" style="position:sticky;left:0;background:var(--surface,white);z-index:2;padding:5px 10px;text-align:left;border-bottom:1.5px solid var(--border,#e5e7eb);border-right:1px solid var(--border,#e5e7eb);vertical-align:bottom;">' + t('subject_label') + '</th>';
      dates.forEach(function(d) {
        html += '<th colspan="3" style="padding:4px 2px 1px;text-align:center;font-size:9px;color:var(--muted,#64748b);font-weight:700;white-space:nowrap;border-bottom:1px solid var(--border,#e5e7eb);border-left:1.5px solid var(--border,#e5e7eb);">' + shortDate(d) + '</th>';
      });
      html += '</tr><tr>';
      dates.forEach(function() {
        html += '<th style="padding:1px;text-align:center;font-size:7px;color:var(--muted,#64748b);font-weight:600;border-left:1.5px solid var(--border,#e5e7eb);border-bottom:1.5px solid var(--border,#e5e7eb);">' + t('cw_abbr') + '</th>' +
                '<th style="padding:1px;text-align:center;font-size:7px;color:var(--muted,#64748b);font-weight:600;border-bottom:1.5px solid var(--border,#e5e7eb);">' + t('hw_abbr') + '</th>' +
                '<th style="padding:1px;text-align:center;font-size:7px;color:var(--muted,#64748b);font-weight:600;border-bottom:1.5px solid var(--border,#e5e7eb);">' + t('disc_abbr') + '</th>';
      });
      html += '</tr></thead><tbody>';

      subjects.forEach(function(subj, idx) {
        var rowBg = idx%2===0 ? 'transparent' : 'var(--surface-2,#f8fafc)';
        var stickyBg = idx%2===0 ? 'var(--surface,white)' : 'var(--surface-2,#f8fafc)';
        html += '<tr style="background:' + rowBg + ';">' +
          '<td style="position:sticky;left:0;background:' + stickyBg + ';padding:5px 10px;font-weight:600;white-space:nowrap;border-right:1px solid var(--border,#e5e7eb);">' + subj + '</td>';
        dates.forEach(function(d) {
          var rec = grid[subj] ? grid[subj][d] : undefined;
          if (!rec) {
            html += '<td colspan="3" style="padding:4px 2px;text-align:center;color:#cbd5e1;border-left:1.5px solid var(--border,#e5e7eb);">·</td>';
          } else if (rec.cancelled) {
            html += '<td colspan="3" title="' + (rec.cancel_reason||'') + '" style="padding:4px 2px;text-align:center;color:#94a3b8;font-size:9px;border-left:1.5px solid var(--border,#e5e7eb);">🚫</td>';
          } else if (rec.absent) {
            html += '<td colspan="3" style="padding:4px 2px;text-align:center;border-left:1.5px solid var(--border,#e5e7eb);"><span style="display:inline-block;padding:1px 6px;border-radius:4px;background:var(--red-light);color:var(--red);font-weight:800;font-size:9px;">' + t('absent') + '</span></td>';
          } else {
            var hasComment = !!(rec.comment && rec.comment.trim());
            // Escaped via a data-attribute, not inlined into an onclick string —
            // avoids any risk of a quote or special character in a teacher's
            // comment breaking the HTML.
            var escapedComment = hasComment ? rec.comment.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;') : '';
            [rec.cw, rec.hw, rec.disc].forEach(function(v, i) {
              var c = pillColor(v);
              var cornerMarker = (hasComment && i===0)
                ? '<span style="position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 7px 7px 0;border-color:transparent var(--green,#16a34a) transparent transparent;"></span>'
                : '';
              html += '<td class="' + (hasComment ? 'has-comment' : '') + '" ' + (hasComment ? 'data-comment="' + escapedComment + '"' : '') +
                ' style="position:relative;padding:3px 1px;text-align:center;' + (i===0?'border-left:1.5px solid var(--border,#e5e7eb);':'') + (hasComment?'cursor:pointer;':'') + '">' +
                cornerMarker +
                '<span style="display:inline-block;min-width:16px;padding:1px 3px;border-radius:4px;background:' + c.bg + ';color:' + c.fg + ';font-weight:800;font-size:10px;">' + (v || '—') + '</span></td>';
            });
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table></div></div>';
      el.innerHTML = html;
      dsWireCommentTooltip(el);
    })
    .catch(function() { el.innerHTML = '<div class="card"><div class="empty-state"><div class="msg">' + t('could_not_load') + '</div></div></div>'; });
  }

  // Small green corner triangle on any cell with a teacher's comment —
  // tap (or hover, on desktop) to see it, tap anywhere else to dismiss.
  // One shared tooltip element reused across renders, and the outside-tap
  // dismiss listener is wired only once regardless of how many times the
  // grid gets rebuilt.
  var _dsTooltipWired = false;
  function dsWireCommentTooltip(container) {
    container.querySelectorAll('.has-comment').forEach(function(cell) {
      cell.addEventListener('click', function(e) {
        e.stopPropagation();
        dsShowComment(cell);
      });
    });
    if (_dsTooltipWired) return;
    _dsTooltipWired = true;
    document.addEventListener('click', dsHideComment);
    document.addEventListener('scroll', dsHideComment, true);
  }

  function dsShowComment(cell) {
    var tip = document.getElementById('ds-comment-tip');
    if (!tip) {
      tip = document.createElement('div');
      tip.id = 'ds-comment-tip';
      tip.style.cssText = 'position:fixed;z-index:9000;max-width:220px;background:#0f172a;color:white;font-size:11.5px;line-height:1.4;padding:8px 11px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.25);pointer-events:none;';
      document.body.appendChild(tip);
    }
    tip.textContent = cell.dataset.comment || '';
    tip.style.display = 'block';
    var rect = cell.getBoundingClientRect();
    var top = rect.bottom + 6;
    var left = Math.max(8, Math.min(window.innerWidth - 228, rect.left - 100));
    // Flip above the cell if there isn't room below (e.g. last row on screen)
    var tipHeight = tip.offsetHeight || 40;
    if (top + tipHeight > window.innerHeight - 8) top = rect.top - tipHeight - 6;
    tip.style.top = top + 'px';
    tip.style.left = left + 'px';
  }

  function dsHideComment() {
    var tip = document.getElementById('ds-comment-tip');
    if (tip) tip.style.display = 'none';
  }

  // ── MARKS (assessments, percentage-based) ──

      var html = '<div class="card"><div class="card-body" style="text-align:center;border-bottom:1px solid var(--rule-light);">' +

        '<thead><tr>' +

      dates.forEach(function(d) {

      });
      html += '</tr></thead><tbody>';

      subjects.forEach(function(subj, idx) {
        html += '<tr style="background:' + (idx%2===0?'transparent':'var(--surface-2,#f8fafc)') + ';">' +
          '<td style="position:sticky;left:0;background:' + (idx%2===0?'var(--surface,white)':'var(--surface-2,#f8fafc)') + ';padding:5px 10px;font-weight:600;white-space:nowrap;border-right:1px solid var(--border,#e5e7eb);">' + subj + '</td>';
        dates.forEach(function(d) {
          var absentHere = grid[subj] ? grid[subj][d] : undefined;
          if (absentHere === undefined) {
            html += '<td style="padding:5px 6px;text-align:center;color:#cbd5e1;">·</td>';
          } else if (absentHere) {
            html += '<td style="padding:5px 6px;text-align:center;"><span style="display:inline-block;width:18px;height:18px;line-height:18px;border-radius:4px;background:var(--red-light);color:var(--red);font-weight:800;font-size:10px;">A</span></td>';
          } else {
            html += '<td style="padding:5px 6px;text-align:center;"><span style="display:inline-block;width:18px;height:18px;line-height:18px;border-radius:4px;background:var(--green-light);color:var(--green);font-weight:800;font-size:10px;">P</span></td>';
          }
        });
        html += '</tr>';
      });
      html += '</tbody></table></div></div>';
      el.innerHTML = html;
    })
    .catch(function() { el.innerHTML = '<div class="card"><div class="empty-state"><div class="msg">' + t('could_not_load') + '</div></div></div>'; });
  }

  // ── DISCIPLINE ──
  function loadDiscipline() {
    var el = document.getElementById('tab-discipline');
    el.innerHTML = '<div class="loading">Loading…</div>';
    var names = studentFullNames();

    // Filtered server-side by student — previously this fetched every
    // incident for every student in the school (no filter at all) and only
    // narrowed it down to this child in the browser, meaning the raw network
    // response handed any parent the whole school's discipline records.
    var nameFilter = 'or=(' + names.map(function(n) { return 'student.eq.' + encodeURIComponent(n); }).join(',') + ')';
    fetch(_SB_URL + '/rest/v1/incidents?' + nameFilter + '&order=created_at.desc&select=*', {
      headers: sbHeaders()
    })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows) {
      var mine = (rows||[]).filter(function(r) { return isMyName(r.student); });
      if (!mine.length) {
        el.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">🛡</div><div class="msg">' + t('no_discipline') + '</div></div></div>';
        return;
      }
      var html = '<div class="card">';
      mine.forEach(function(r) {
        html += '<div class="item-row"><div class="item-top"><div class="item-title">' + (r.type||'Incident') + (r.subject ? ' (' + r.subject + ')' : '') + '</div><div class="item-date">' + (r.created_at||'').slice(0,10) + '</div></div>' +
          (r.class ? '<div class="item-detail">Class: ' + r.class + '</div>' : '') +
          (r.stage ? '<div class="item-detail">Stage: ' + r.stage + '</div>' : '') +
          (r.notes ? '<div class="item-detail">' + r.notes + '</div>' : '') +
          '<div style="margin-top:6px;"><span class="badge" style="background:var(--amber-light);color:var(--amber);">' + (r.status||'logged') + '</span></div>' +
        '</div>';
      });
      html += '</div>';
      el.innerHTML = html;
    })
    .catch(function() { el.innerHTML = '<div class="card"><div class="empty-state"><div class="msg">' + t('could_not_load') + '</div></div></div>'; });
  }

  // ── PROGRESS (charts) ──
  var _marksChart = null, _attChart = null;

  function loadProgress() {
    var el = document.getElementById('tab-progress');
    el.innerHTML =
      '<div class="card"><div class="card-body"><b style="font-size:13px;">' + t('marks_trend') + '</b>' +
      '<div style="position:relative;height:220px;margin-top:10px;"><canvas id="marks-chart"></canvas></div></div></div>' +
      '<div class="card"><div class="card-body"><b style="font-size:13px;">' + t('attendance_trend') + '</b>' +
      '<div style="position:relative;height:180px;margin-top:10px;"><canvas id="att-chart"></canvas></div></div></div>';

    var names = studentFullNames();

    fetch(_SB_URL + '/rest/v1/assessments?class=eq.' + encodeURIComponent(_student.class) + '&order=date.asc&select=*', {
      headers: sbHeaders()
    })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows) {
      var bySubject = {};
      (rows||[]).forEach(function(a) {
        (a.students||[]).forEach(function(s) {
          if (!isMyName(s.name) || s.absent || s.pct === null || s.pct === undefined) return;
          bySubject[a.subject] = bySubject[a.subject] || [];
          bySubject[a.subject].push({ x: a.date, y: s.pct });
        });
      });
      var subjects = Object.keys(bySubject);
      var canvas = document.getElementById('marks-chart');
      if (!subjects.length) {
        if (canvas) canvas.parentElement.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="msg">' + t('no_marks') + '</div></div>';
        return;
      }
      var palette = ['#7367F0','#28C76F','#FF9F43','#EA5455','#00CFE8','#8B5CF6'];
      var datasets = subjects.map(function(subj, i) {
        return { label: subj, data: bySubject[subj], borderColor: palette[i % palette.length],
          backgroundColor: palette[i % palette.length] + '22', tension: 0.3, pointRadius: 4 };
      });
      if (canvas && typeof Chart !== 'undefined') {
        var ctx = canvas.getContext('2d');
        if (_marksChart) _marksChart.destroy();
        _marksChart = new Chart(ctx, {
          type: 'line', data: { datasets: datasets },
          options: { responsive: true, maintainAspectRatio: false,
            scales: { x: { type: 'time', time: { unit: 'week' }, grid: { display:false } }, y: { min:0, max:100, ticks: { callback: function(v){return v+'%';} } } },
            plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } } }
        });
      }
    });

    fetch(_SB_URL + '/rest/v1/daily_reports?class=eq.' + encodeURIComponent(_student.class) + '&order=date.asc&limit=200&select=*', {
      headers: sbHeaders()
    })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows) {
      var byDate = {};
      (rows||[]).forEach(function(r) {
        (r.students||[]).forEach(function(s) {
          if (!isMyName(s.name)) return;
          byDate[r.date] = byDate[r.date] || { total: 0, present: 0 };
          byDate[r.date].total++;
          if (!s.absent) byDate[r.date].present++;
        });
      });
      var dates = Object.keys(byDate).sort();
      var canvas2 = document.getElementById('att-chart');
      if (!dates.length) {
        if (canvas2) canvas2.parentElement.innerHTML = '<div class="empty-state" style="padding:20px;"><div class="msg">' + t('no_attendance') + '</div></div>';
        return;
      }
      var points = dates.map(function(d) {
        var v = byDate[d];
        return { x: d, y: Math.round((v.present / v.total) * 100) };
      });
      if (canvas2 && typeof Chart !== 'undefined') {
        var ctx2 = canvas2.getContext('2d');
        if (_attChart) _attChart.destroy();
        _attChart = new Chart(ctx2, {
          type: 'bar',
          data: { datasets: [{ label: t('tab_attendance'), data: points,
            backgroundColor: points.map(function(p){ return p.y >= 90 ? '#28C76F' : p.y >= 75 ? '#FF9F43' : '#EA5455'; }) }] },
          options: { responsive: true, maintainAspectRatio: false,
            scales: { x: { type: 'time', time: { unit: 'day' }, grid: { display:false } }, y: { min:0, max:100, ticks: { callback: function(v){return v+'%';} } } },
            plugins: { legend: { display: false } } }
        });
      }
    });
  }

  // ── CALENDAR (live, no sample data) ──
  function loadCalendar() {
    var el = document.getElementById('tab-calendar');
    el.innerHTML = '<div class="loading">Loading…</div>';

    // Local date, not toISOString() — toISOString() converts to UTC, and
    // Samarkand is UTC+5 with no daylight saving, so between roughly
    // midnight and 5am local time the UTC date is still "yesterday",
    // which would let an already-past event still show as upcoming.
    var now = new Date();
    var today = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    fetch(_SB_URL + '/rest/v1/calendar_events?date=gte.' + today + '&order=date.asc&select=*', {
      headers: sbHeaders()
    })
    .then(function(r){ return r.ok ? r.json() : []; })
    .then(function(rows) {
      rows = rows || [];
      if (!rows.length) {
        el.innerHTML = '<div class="card"><div class="empty-state"><div class="icon">📅</div><div class="msg">' + t('no_events') + '</div></div></div>';
        return;
      }
      var html = '<div class="card">';
      rows.forEach(function(ev) {
        var d = new Date(ev.date + 'T12:00:00');
        var dateStr = d.toLocaleDateString(_lang === 'ru' ? 'ru-RU' : _lang === 'uz' ? 'uz-UZ' : 'en-GB', { day:'numeric', month:'short', year:'numeric' });
        html += '<div class="item-row">' +
          '<div class="item-top"><div class="item-title">' + (ev.title||'') + '</div><div class="item-date">' + dateStr + '</div></div>' +
          (ev.description ? '<div class="item-detail">' + ev.description + '</div>' : '') +
        '</div>';
      });
      html += '</div>';
      el.innerHTML = html;
    })
    .catch(function() { el.innerHTML = '<div class="card"><div class="empty-state"><div class="msg">' + t('could_not_load') + '</div></div></div>'; });
  }

  // (Message Teacher feature removed — loadMessages/renderTeacherPicker/renderThread deleted)

  // ══ PUSH NOTIFICATIONS ═══════════════════════════════════════════════
  var _VAPID_PUBLIC_KEY = 'BLKTbVN_CHUQmYLJfdZzHW5PeBCupPS9xfvAe9FHHQQ510YXf-sjPL2xG7FILD0TU2HN965Z5RxtJ403r8yqRBk';

  function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var rawData = window.atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  function enablePushNotifications(ownerType, ownerId) {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      return Promise.reject(new Error('Push notifications are not supported on this browser.'));
    }
    return navigator.serviceWorker.register('/sw.js')
      .then(function(reg) { return reg.pushManager.getSubscription().then(function(existing) {
        if (existing) return existing;
        return Notification.requestPermission().then(function(permission) {
          if (permission !== 'granted') throw new Error('Notification permission was not granted.');
          return reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(_VAPID_PUBLIC_KEY)
          });
        });
      }); })
      .then(function(subscription) {
        return fetch(_SB_URL + '/rest/v1/push_subscriptions', {
          method: 'POST',
          headers: sbHeaders({ 'Content-Type': 'application/json', 'Prefer': 'resolution=merge-duplicates,return=minimal' }),
          body: JSON.stringify({ owner_type: ownerType, owner_id: String(ownerId), subscription: subscription.toJSON() })
        });
      });
  }

  function sendPushNotification(ownerType, ownerId, title, body, url) {
    fetch('/.netlify/functions/send-push', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ owner_type: ownerType, owner_id: String(ownerId), title: title, body: body, url: url })
    }).catch(function(){}); // best-effort — a failed push shouldn't block the message itself
  }

  function handleEnablePush() {
    var btn = document.getElementById('notif-btn');
    btn.textContent = 'Enabling…';
    enablePushNotifications('parent', _student.id)
      .then(function() { btn.textContent = '🔔 Notifications On'; btn.disabled = true; })
      .catch(function(e) { btn.textContent = '🔔 Enable Notifications'; alert(e.message); });
  }

  // (sendParentMessage removed along with the Message Teacher tab)

  // ── AUTO LOGIN + LANGUAGE RESTORE ──
  window.addEventListener('load', function() {
    var savedLang = localStorage.getItem('parent_lang') || 'en';
    setLang(savedLang);

    var saved = localStorage.getItem('parent_code');
    if (saved) {
      document.getElementById('code-input').value = saved;
      doLogin();
    }
  });
</script>
